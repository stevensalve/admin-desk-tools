<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Travel Request Form - cost estimate and approval form (offline)</title>
    <meta
      name="description"
      content="Estimate trip costs with per-diem and print a travel request for approval. Runs in your browser; nothing is uploaded."
    />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <main class="container wide">
      <header class="site">
        <div>
          <h1>Travel Request Form</h1>
          <p>Estimate trip costs and print a request for approval.</p>
        </div>
        <span class="badge">Works offline - nothing leaves this device</span>
      </header>

      <section class="card" aria-labelledby="h-who">
        <h2 id="h-who">1. Traveller and trip</h2>
        <div class="grid">
          <div><label for="number">Request number</label><input type="text" id="number" maxlength="40" /></div>
          <div><label for="date">Request date</label><input type="date" id="date" /></div>
          <div><label for="t-name">Traveller</label><input type="text" id="t-name" maxlength="80" /></div>
          <div><label for="t-id">Employee ID</label><input type="text" id="t-id" maxlength="20" /></div>
          <div><label for="t-dept">Department</label><input type="text" id="t-dept" maxlength="60" /></div>
          <div><label for="t-desig">Designation</label><input type="text" id="t-desig" maxlength="60" /></div>
          <div><label for="approver">Approver</label><input type="text" id="approver" maxlength="80" /></div>
          <div><label for="project">Project / cost centre</label><input type="text" id="project" maxlength="80" /></div>
        </div>
        <label for="purpose">Purpose of travel</label>
        <textarea id="purpose" rows="2" maxlength="300"></textarea>
        <div class="grid">
          <div><label for="from">From</label><input type="text" id="from" maxlength="60" /></div>
          <div><label for="to">To</label><input type="text" id="to" maxlength="60" /></div>
          <div><label for="depart">Departure date</label><input type="date" id="depart" /></div>
          <div><label for="return">Return date (blank if same day)</label><input type="date" id="return" /></div>
          <div>
            <label for="mode">Main mode</label
            ><select id="mode"></select>
          </div>
        </div>
      </section>

      <section class="card" aria-labelledby="h-cost">
        <h2 id="h-cost">2. Cost estimate</h2>
        <h3>Fares</h3>
        <div id="fares"></div>
        <div class="row"><button id="add-fare" type="button">Add fare</button></div>
        <div class="grid">
          <div>
            <label for="hotel-rate">Hotel per night (Rs.)</label><input type="number" id="hotel-rate" value="0" min="0" step="any" />
          </div>
          <div>
            <label for="hotel-nights">Nights (blank = days minus one)</label><input type="number" id="hotel-nights" min="0" step="1" />
          </div>
          <div><label for="perdiem">Per diem per day (Rs.)</label><input type="number" id="perdiem" value="0" min="0" step="any" /></div>
          <div><label for="local">Local conveyance (Rs.)</label><input type="number" id="local" value="0" min="0" step="any" /></div>
          <div>
            <label for="advance">Advance requested (% of total)</label><input type="number" id="advance" value="0" min="0" max="100" />
          </div>
        </div>
        <h3>Other costs</h3>
        <div id="others"></div>
        <div class="row"><button id="add-other" type="button">Add other cost</button></div>
        <details>
          <summary>Policy limits (only raise warnings)</summary>
          <div class="grid">
            <div><label for="cap-hotel">Hotel limit per night (Rs.)</label><input type="number" id="cap-hotel" value="0" min="0" /></div>
            <div><label for="cap-pd">Per diem limit (Rs.)</label><input type="number" id="cap-pd" value="0" min="0" /></div>
          </div>
        </details>
      </section>

      <section class="card" aria-labelledby="h-out">
        <h2 id="h-out">3. Estimate and download</h2>
        <table class="totals">
          <tbody id="totals"></tbody>
        </table>
        <p id="words"></p>
        <ul id="warnings"></ul>
        <ul id="problems"></ul>
        <div class="grid">
          <div><label for="company">Company name (printed on the form)</label><input type="text" id="company" maxlength="80" /></div>
        </div>
        <div class="row">
          <button class="primary" id="pdf" type="button">Download PDF</button>
          <button id="csv" type="button">Cost lines CSV</button>
          <button id="save" type="button">Save (.json)</button>
          <label class="file">Open saved file<input type="file" id="open" accept=".json,application/json" /></label>
        </div>
        <p class="status" id="status" role="status"></p>
      </section>

      <footer class="site"><a href="../../index.html">All tools</a> - MIT licensed - <a href="vendor/README.md">pdf-lib</a></footer>
    </main>
    <script src="vendor/pdf-lib.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/core.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
